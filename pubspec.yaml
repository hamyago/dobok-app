name: dobok_app
description: Do-Bok — Plateforme de gestion du Taekwondo en Côte d'Ivoire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  dio: ^5.4.0
  
  # State management
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Géolocalisation
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  
  # Notifications push
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^17.2.4
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # PDF
  printing: ^5.12.0
  pdf: ^3.10.8
  
  # Image
  image_picker: ^1.0.7
  
  # Flavor
  flutter_flavor: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/icons/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A7A3C"
  adaptive_icon_foreground: "assets/images/logo.png"
